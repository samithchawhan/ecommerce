<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — VOLTA</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo">VOLTA</a>
      <div class="nav-search">
        <input type="text" placeholder="Search products…">
        <button><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
      </div>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-badge" id="cartCount">0</span>
        </a>
        <div class="auth-menu" id="authMenu"></div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="product-detail" id="productDetail">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let productData = null;
    let selectedQty = 1;
    let selectedRating = 0;

    Auth.renderNav();

    async function loadProduct() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { location.href = '../index.html'; return; }

      try {
        const data = await API.getProduct(id);
        productData = data.product;
        renderProduct(data);
      } catch(e) {
        document.getElementById('productDetail').innerHTML =
          `<p style="color:var(--red);padding:40px">Product not found.</p>`;
      }
    }

    function renderProduct(data) {
      const p = data.product;
      document.title = `${p.name} — VOLTA`;
      const discount = p.original_price ? Math.round((1 - p.price / p.original_price) * 100) : null;
      const stockLevel = p.stock < 10 ? 'low' : '';

      document.getElementById('productDetail').innerHTML = `
        <div class="breadcrumb">
          <a href="../index.html">Home</a>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          <a href="../index.html">${p.category_name}</a>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          <span>${p.name}</span>
        </div>

        <div class="detail-grid">
          <div>
            <div class="detail-image-main">
              <img src="${p.image_url}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/600/161b27/6c63ff?text=Product'">
            </div>
          </div>

          <div class="detail-info">
            <div class="detail-category">${p.category_name}</div>
            <h1 class="detail-name">${p.name}</h1>

            <div class="detail-rating">
              ${renderStars(p.rating, false, 18)}
              <span>${p.rating.toFixed(1)} — ${p.review_count} reviews</span>
            </div>

            <div class="detail-price-row">
              <span class="detail-price">${formatPrice(p.price)}</span>
              ${p.original_price ? `<span class="detail-original">${formatPrice(p.original_price)}</span>` : ''}
              ${discount ? `<span class="detail-discount">Save ${discount}%</span>` : ''}
            </div>

            <p class="detail-description">${p.description}</p>

            <div class="stock-indicator">
              <div class="stock-dot ${stockLevel}"></div>
              <span>${p.stock < 10 ? `Only ${p.stock} left` : 'In stock'}</span>
            </div>

            <div class="qty-row">
              <span class="qty-label">Quantity</span>
              <div class="qty-control">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <span class="qty-val" id="qtyDisplay">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
              </div>
            </div>

            <button class="btn-primary add-to-cart-btn" onclick="addToCart()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              Add to Cart
            </button>
          </div>
        </div>

        ${data.reviews.length > 0 || Auth.user ? renderReviewsSection(data.reviews) : ''}

        ${data.related.length > 0 ? `
          <div class="related-section">
            <h2>You may also like</h2>
            <div class="related-grid">
              ${data.related.map(r => relatedCard(r)).join('')}
            </div>
          </div>` : ''}
      `;
    }

    function renderReviewsSection(reviews) {
      return `
        <div class="reviews-section">
          <h2>Customer Reviews</h2>
          ${Auth.user ? `
            <div class="add-review">
              <h3>Write a Review</h3>
              <div class="star-rating" id="starRating">
                ${[1,2,3,4,5].map(i => `<button class="star-btn" data-val="${i}" onclick="setRating(${i})">★</button>`).join('')}
              </div>
              <textarea class="review-textarea" id="reviewText" placeholder="Share your experience with this product…"></textarea>
              <button class="btn-primary" style="margin-top:12px" onclick="submitReview()">Submit Review</button>
            </div>` : `<p style="color:var(--text-muted);margin-bottom:24px;font-size:14px"><a href="login.html" style="color:var(--accent)">Sign in</a> to leave a review.</p>`}
          ${reviews.map(r => `
            <div class="review-card">
              <div class="review-header">
                <div>
                  <div class="reviewer-name">${r.user_name}</div>
                  <div class="review-date">${formatDate(r.created_at)}</div>
                </div>
              </div>
              <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
              ${r.comment ? `<p class="review-text">${r.comment}</p>` : ''}
            </div>`).join('')}
        </div>`;
    }

    function relatedCard(p) {
      return `
        <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'" style="cursor:pointer">
          <div class="product-image-wrap" style="aspect-ratio:1">
            <img src="${p.image_url}" alt="${p.name}" loading="lazy">
          </div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price"><span class="price-current">${formatPrice(p.price)}</span></div>
          </div>
        </div>`;
    }

    function changeQty(delta) {
      selectedQty = Math.max(1, Math.min(selectedQty + delta, productData?.stock || 99));
      document.getElementById('qtyDisplay').textContent = selectedQty;
    }

    function addToCart() {
      if (!productData) return;
      Cart.add(productData, selectedQty);
    }

    function setRating(val) {
      selectedRating = val;
      document.querySelectorAll('.star-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i < val);
      });
    }

    async function submitReview() {
      if (!Auth.requireAuth()) return;
      if (!selectedRating) { showToast('Please select a rating', 'error'); return; }
      const comment = document.getElementById('reviewText').value.trim();
      try {
        await API.addReview(productData.id, { rating: selectedRating, comment });
        showToast('Review submitted!', 'success');
        loadProduct();
      } catch(e) {
        showToast(e.message, 'error');
      }
    }

    loadProduct();
  </script>
</body>
</html>
