<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — VOLTA</title>
  <link rel="stylesheet" href="../css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo">VOLTA</a>
      <div style="flex:1"></div>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-badge" id="cartCount">0</span>
        </a>
        <div class="auth-menu" id="authMenu"></div>
      </div>
    </div>
  </nav>

  <div class="container cart-page">
    <h1 class="page-title">Shopping Cart</h1>
    <div id="cartContent"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    Auth.renderNav();

    function render() {
      const el = document.getElementById('cartContent');
      if (Cart.items.length === 0) {
        el.innerHTML = `
          <div class="empty-cart">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <h3>Your cart is empty</h3>
            <p>Looks like you haven't added anything yet.</p>
            <a href="../index.html" class="btn-primary">Browse Products</a>
          </div>`;
        return;
      }

      const subtotal = Cart.total;
      const shipping = subtotal > 50 ? 0 : 5.99;
      const tax = subtotal * 0.08;
      const total = subtotal + shipping + tax;

      el.innerHTML = `
        <div class="cart-grid">
          <div class="cart-items">
            ${Cart.items.map(item => `
              <div class="cart-item">
                <img class="cart-item-img" src="${item.image_url}" alt="${item.name}"
                  onerror="this.src='https://via.placeholder.com/80/161b27/6c63ff?text=?'"
                  onclick="location.href='product.html?id=${item.id}'" style="cursor:pointer">
                <div class="cart-item-info">
                  <div class="cart-item-name" onclick="location.href='product.html?id=${item.id}'" style="cursor:pointer">${item.name}</div>
                  <div class="cart-item-price">${formatPrice(item.price)}</div>
                  <div class="cart-item-controls">
                    <div class="cart-qty">
                      <button onclick="updateQty(${item.id}, ${item.quantity - 1})">−</button>
                      <span>${item.quantity}</span>
                      <button onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
                    <span style="margin-left:auto;font-weight:700;font-size:15px">${formatPrice(item.price * item.quantity)}</span>
                  </div>
                </div>
              </div>`).join('')}
          </div>

          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Subtotal (${Cart.count} items)</span><span>${formatPrice(subtotal)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--green)">Free</span>' : formatPrice(shipping)}</span></div>
            <div class="summary-row"><span>Tax (8%)</span><span>${formatPrice(tax)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
            ${subtotal <= 50 ? `<p style="font-size:12px;color:var(--text-dim);margin-top:8px">Add ${formatPrice(50 - subtotal)} more for free shipping</p>` : ''}
            <button class="btn-primary checkout-btn" onclick="goCheckout()">
              Proceed to Checkout
            </button>
            <a href="../index.html" class="btn-secondary" style="width:100%;justify-content:center;margin-top:10px">Continue Shopping</a>
          </div>
        </div>`;
    }

    function updateQty(id, qty) {
      Cart.updateQty(id, qty);
      render();
    }

    function removeItem(id) {
      Cart.remove(id);
      render();
    }

    function goCheckout() {
      if (!Auth.user) {
        showToast('Please sign in to checkout', 'error');
        setTimeout(() => location.href = 'login.html', 1200);
        return;
      }
      location.href = 'checkout.html';
    }

    render();
  </script>
</body>
</html>
